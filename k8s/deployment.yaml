apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      name: payment-service
      namespace: exercise3
      labels:
        app: payment-service
        metadata:
    spec:
      containers:
      - name: payment-service
        image: poobesh1/payment-service:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80
